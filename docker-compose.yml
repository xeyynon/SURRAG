services:
  postgres:
    image: postgres:16-alpine
    container_name: crimelink-postgres
    environment:
      POSTGRES_USER: crimelink
      POSTGRES_PASSWORD: crimelink
      POSTGRES_DB: crimelink
    ports:
      - "5432:5432"
    volumes:
      - crimelink_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crimelink"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: crimelink-neo4j
    environment:
      NEO4J_AUTH: neo4j/crimelink123
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - crimelink_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    container_name: crimelink-qdrant
    ports:
      - "6333:6333"
    volumes:
      - crimelink_qdrant_data:/qdrant/storage

volumes:
  crimelink_pg_data:
  crimelink_neo4j_data:
  crimelink_qdrant_data:
